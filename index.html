<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0E1B2C" />
    <meta name="robots" content="noindex, nofollow" />
    <title>葡萄を恋にする魔法</title>
    <link rel="preload" as="image" href="assets/cover.jpg" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="experience" data-state="cover">
      <div class="swirl" aria-hidden="true"></div>
      <div class="stars" aria-hidden="true">
        <i></i><i></i><i></i><i></i><i></i>
      </div>

      <header class="edition" aria-label="收藏資訊">
        <span>No. 001 / 001</span>
        <span>2026 · 元旦</span>
      </header>

      <button class="artwork" type="button" aria-label="播放製作影片">
        <picture class="cover-picture">
          <source srcset="assets/cover.png" type="image/png" />
          <img src="assets/cover.jpg" alt="葡萄を恋にする魔法收藏卡封面" />
        </picture>
        <span class="glint" aria-hidden="true"></span>
        <span class="play-button" aria-hidden="true">
          <span class="play-ring"></span>
          <svg viewBox="0 0 24 24"><path d="M9 7.4 17 12l-8 4.6Z" /></svg>
        </span>
      </button>

      <section class="title-block" aria-labelledby="title">
        <h1 id="title"><span>葡萄を</span><span>恋にする魔法</span></h1>
        <p>THE MAGIC THAT MAKES GRAPES FALL IN LOVE</p>
      </section>

      <button class="begin" type="button">touch to begin</button>
      <p class="ending-copy" aria-live="polite"></p>

      <section class="player" aria-label="影片播放器">
        <video
          src="assets/video.mp4?v=1"
          poster="assets/cover.jpg"
          preload="metadata"
          playsinline
          webkit-playsinline
        ></video>
        <p class="mini-title">葡萄を恋にする魔法</p>

        <div class="buffer" aria-hidden="true"></div>
        <p class="error-message" role="status">影片暫時無法播放，請稍後再試</p>

        <button class="mute-control control-button" type="button" aria-label="關閉聲音">
          <svg class="sound-on" viewBox="0 0 24 24"><path d="M5 10v4h3l4 3V7L8 10H5Zm10.5-2.5a6 6 0 0 1 0 9M14 10a3 3 0 0 1 0 4" /></svg>
          <svg class="sound-off" viewBox="0 0 24 24"><path d="M5 10v4h3l4 3V7L8 10H5Zm10-1 5 6m0-6-5 6" /></svg>
        </button>

        <button class="center-pause" type="button" aria-label="暫停影片">
          <svg viewBox="0 0 24 24"><path d="M9 7v10M15 7v10" /></svg>
        </button>

        <div class="controls">
          <div class="progress-wrap">
            <input class="progress" type="range" min="0" max="1000" value="0" aria-label="影片進度" />
          </div>
          <button class="toggle-play control-button" type="button" aria-label="暫停">
            <svg class="pause-icon" viewBox="0 0 24 24"><path d="M9 6v12M15 6v12" /></svg>
            <svg class="play-icon" viewBox="0 0 24 24"><path d="m9 6 9 6-9 6Z" /></svg>
          </button>
          <output class="timecode">0:00 / 0:00</output>
        </div>
      </section>

      <p class="status-message" role="status">Coming soon</p>
    </main>
    <script src="script.js"></script>
  </body>
</html>
