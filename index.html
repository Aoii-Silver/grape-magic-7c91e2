<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1b2c">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>ぶどうをラブラブにする魔法</title>
  <link rel="preload" as="image" href="assets/cover.jpg">
  <link rel="preload" as="font" href="assets/fonts/title-fine.woff2" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body>
<main class="experience" data-state="cover">
  <div class="cover-page">
    <header class="masthead" aria-label="收藏品資訊">
      <span class="collection">A POOKEMOM ARTIST EDITION</span>
      <span class="edition">001 <i>/</i> 001</span>
    </header>
    <div class="presentation">
      <div class="stage">
        <div class="artwork-wrap">
          <span class="margin-note" aria-hidden="true">THE MAGIC SINCE 2025.12.31</span>
          <button class="artwork" type="button" aria-label="播放卡牌製作影片">
            <img src="assets/cover.jpg" width="815" height="1110" alt="ぶどうをラブラブにする魔法原創手繪收藏卡" fetchpriority="high">
            <span class="foil" aria-hidden="true"></span>
            <span class="play-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m9 6 9 6-9 6Z"/></svg></span>
          </button>
        </div>
      </div>
      <section class="title-block" aria-labelledby="title">
        <p class="eyebrow">ハッピーバースデー FOR MY XUAN BAO</p>
        <h1 id="title" lang="ja"><span>ぶどうを</span><span><span class="love-shimmer">ラブラブ</span>にする魔法</span></h1>
        <p class="subtitle" lang="en">give us a little more magic</p>
      </section>
    </div>
    <footer class="cover-footer">
      <button class="begin" type="button" aria-label="開啟製作影片"><span class="begin-label">touch to begin</span><span class="begin-line" aria-hidden="true"></span></button>
      <p class="status-message" role="status" aria-live="polite"></p>
    </footer>
  </div>
  <section class="player" aria-label="卡牌製作影片播放器" aria-hidden="true" inert>
    <video src="assets/video.mp4?v=3" poster="assets/cover.jpg" preload="metadata" playsinline webkit-playsinline></video>
    <div class="player-top player-ui">
      <button class="close-player control-button" type="button" aria-label="返回封面"><svg viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></svg></button>
      <p class="mini-title" lang="ja">ぶどうをラブラブにする魔法</p>
      <button class="mute-control control-button" type="button" aria-label="關閉聲音" aria-pressed="false">
        <svg class="sound-on" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4Zm12-2a7 7 0 0 1 0 10m-1-7a3 3 0 0 1 0 4"/></svg>
        <svg class="sound-off" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4Zm13 0 5 6m0-6-5 6"/></svg>
      </button>
    </div>
    <div class="buffer" aria-hidden="true"></div>
    <div class="controls player-ui">
      <input class="progress" type="range" min="0" max="1000" step="1" value="0" aria-label="影片進度" aria-valuetext="0:00" disabled>
      <div class="controls-bottom">
        <button class="toggle-play control-button" type="button" aria-label="暫停影片">
          <svg class="pause-icon" viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg>
          <svg class="play-icon" viewBox="0 0 24 24"><path d="m9 6 9 6-9 6Z"/></svg>
        </button>
        <output class="timecode" aria-label="播放時間">0:00 / 0:00</output>
      </div>
    </div>
  </section>
  <noscript><p class="no-script">開啟 JavaScript 以觀看收藏影片，或<a href="assets/video.mp4">直接觀看影片</a>。</p></noscript>
</main>
<script src="script.js?v=3"></script>
</body>
</html>
